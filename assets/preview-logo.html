<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Logo Oficial - TurboSpotter</title>
  <style>
    body {
      margin: 0;
      background: #090b10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .preview-card {
      background: #121622;
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 36px;
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      text-align: center;
      max-width: 440px;
      width: 100%;
    }
    .logo-container {
      width: 250px;
      height: 250px;
      margin: 0 auto 24px;
      box-shadow: 0 16px 40px rgba(239, 68, 68, 0.4);
      border-radius: 54px;
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .logo-container:hover {
      transform: scale(1.03);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      letter-spacing: 0.05em;
      color: #ef4444;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin: 0 0 20px;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="preview-card">
    <div class="logo-container">
      <img src="logo.jpg" alt="Logo TurboSpotter" width="100%" height="100%" />
    </div>
    <h2>TURBOSPOTTER</h2>
    <p>Logo oficial activo en la app: <strong>Turbo Compresor</strong> fusionado con <strong>Auto Deportivo</strong> sobre fondo rojo en formato Squircle de Android.</p>
    <span class="badge">Aplicado en Splash Screen, Login y Favicon</span>
  </div>
</body>
</html>
